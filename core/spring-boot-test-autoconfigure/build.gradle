plugins {
	id "java-library"
	id "org.springframework.boot.configuration-metadata"
	id "org.springframework.boot.deployed"
	id "org.springframework.boot.optional-dependencies"
}

description = "Spring Boot Test AutoConfigure"

dependencies {
	api(project(":core:spring-boot-test"))

	compileOnly("org.mockito:mockito-core")

	optional(project(":core:spring-boot-autoconfigure"))
	optional("jakarta.json.bind:jakarta.json.bind-api")
	optional("org.junit.jupiter:junit-jupiter-api")

	testImplementation(project(":test-support:spring-boot-test-support"))
	testImplementation("ch.qos.logback:logback-classic")
	testImplementation("org.junit.platform:junit-platform-launcher")

	testRuntimeOnly("org.aspectj:aspectjrt")
	testRuntimeOnly("org.aspectj:aspectjweaver")
}

tasks.named("compileTestJava") {
	options.nullability.checking = "tests"
}
