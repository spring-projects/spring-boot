plugins {
	id "org.springframework.boot.starter"
}

description = "Starter for testing JAX-RS and Jersey"

dependencies {
	api(project(":starter:spring-boot-starter-jersey"))
	api(project(":starter:spring-boot-starter-test"))
	api(project(":module:spring-boot-resttestclient"))
}

checkRuntimeClasspathForConflicts {
	ignore { name -> name.startsWith("org/aopalliance/intercept/") }
	ignore { name -> name.startsWith("org/aopalliance/aop/") }
}
