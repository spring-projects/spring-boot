plugins {
	id "java-library"
	id "org.jetbrains.kotlin.jvm"
	id "org.springframework.boot.deployed"
}

description = "Spring Boot Configuration Symbol Processor"

dependencies {
	api(project(":configuration-metadata:spring-boot-configuration-processor"))

	compileOnly("com.google.devtools.ksp:symbol-processing-api:${kspVersion}")

	testImplementation(enforcedPlatform(project(":platform:spring-boot-dependencies")))
	testImplementation(project(":test-support:spring-boot-test-support"))
	testImplementation("com.google.devtools.ksp:symbol-processing-api:${kspVersion}")
	testImplementation("com.google.devtools.ksp:symbol-processing-aa-embeddable:${kspVersion}")
	testImplementation("com.google.devtools.ksp:symbol-processing-common-deps:${kspVersion}")
}
