plugins {
	id "java"
}

description = "Spring Boot Data LDAP smoke test"

dependencies {
	implementation(project(":starter:spring-boot-starter-data-ldap"))

	runtimeOnly("com.unboundid:unboundid-ldapsdk")

	testImplementation(project(":starter:spring-boot-starter-data-ldap-test"))
}

tasks.named("compileTestJava") {
	options.nullability.checking = "tests"
}
