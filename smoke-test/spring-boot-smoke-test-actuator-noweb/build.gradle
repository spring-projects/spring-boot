plugins {
	id "java"
}

description = "Spring Boot Actuator non-web smoke test"

dependencies {
	annotationProcessor(project(":configuration-metadata:spring-boot-configuration-processor"))

	implementation(project(":starter:spring-boot-starter-actuator"))

	testImplementation(project(":starter:spring-boot-starter-actuator-test"))
}

tasks.named("compileTestJava") {
	options.nullability.checking = "tests"
}
