plugins {
	id 'java'
	id 'org.springframework.boot' version '{version}'
}

bootBuildImage {
	imageName = "example/test-image-custom"
	builder = "ghcr.io/spring-io/spring-boot-cnb-test-builder:0.0.4"
	runImage = "paketobuildpacks/ubuntu-resolute-run-tiny"
	pullPolicy = "IF_NOT_PRESENT"
}
