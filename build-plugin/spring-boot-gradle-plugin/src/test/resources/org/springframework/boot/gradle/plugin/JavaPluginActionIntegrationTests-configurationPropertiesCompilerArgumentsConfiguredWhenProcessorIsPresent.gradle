plugins {
	id 'java'
	id 'org.springframework.boot' version '{version}'
}

repositories {
	flatDir { dirs 'libs' }
}

dependencies {
	annotationProcessor(':spring-boot-configuration-processor:1.2.3')
}

compileJava {
	doLast {
		println "${name} compiler args: ${options.compilerArgs}"
	}
}
