plugins {
	id 'war'
	id 'java'
	id 'org.springframework.boot' version '{version}'
}

bootWar {
	mainClass = 'com.example.Application'
}

repositories {
	mavenCentral()
	maven {
		url = 'repository'
	}
}

dependencies {
	implementation("org.bouncycastle:bcprov-jdk18on:1.78.1")
}
