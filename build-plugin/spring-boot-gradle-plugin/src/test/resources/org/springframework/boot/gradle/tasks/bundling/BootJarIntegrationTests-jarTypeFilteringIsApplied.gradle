plugins {
	id 'java'
	id 'org.springframework.boot' version '{version}'
}

bootJar {
	mainClass = 'com.example.Application'
}

repositories {
	flatDir {
		dirs 'repository'
	}
}

dependencies {
	implementation(":standard:")
	implementation(":starter:")
}

bootJar {
	includeTools = false
}
