plugins {
	id 'java'
	id 'org.springframework.boot' version '{version}'
}

bootJar {
	mainClass = 'com.example.Application'
	if (GradleVersion.current().compareTo(GradleVersion.version("9.0.0-rc-1")) < 0) {
		preserveFileTimestamps = false
		reproducibleFileOrder = true
	}
}
