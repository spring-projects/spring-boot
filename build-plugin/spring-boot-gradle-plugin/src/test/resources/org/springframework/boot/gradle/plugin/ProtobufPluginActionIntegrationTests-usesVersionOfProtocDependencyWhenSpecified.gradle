plugins {
	id 'org.springframework.boot' version '{version}'
	id 'java'
}

apply plugin: 'com.google.protobuf'

group = 'com.example'
version = '0.0.1'

repositories {
	mavenCentral()
}

protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:4.33.5"
	}
}
