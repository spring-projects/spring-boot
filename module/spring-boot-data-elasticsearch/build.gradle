plugins {
	id "java-library"
	id "org.springframework.boot.auto-configuration"
	id "org.springframework.boot.configuration-properties"
	id "org.springframework.boot.deployed"
	id "org.springframework.boot.docker-test"
	id "org.springframework.boot.optional-dependencies"
}

description = "Spring Boot Data Elasticsearch"

dependencies {
	api(project(":module:spring-boot-data-commons"))
	api(project(":module:spring-boot-elasticsearch"))
	api(project(":module:spring-boot-transaction"))
	api("org.springframework.data:spring-data-elasticsearch")

	optional(project(":core:spring-boot-autoconfigure"))
	optional(project(":module:spring-boot-health"))
	optional(project(":module:spring-boot-reactor"))

	dockerTestImplementation(project(":core:spring-boot-test"))
	dockerTestImplementation(project(":test-support:spring-boot-docker-test-support"))
	dockerTestImplementation(testFixtures(project(":core:spring-boot-autoconfigure")))
	dockerTestImplementation("ch.qos.logback:logback-classic")
	dockerTestImplementation("org.junit.jupiter:junit-jupiter")
	dockerTestImplementation("org.testcontainers:testcontainers-elasticsearch")
	dockerTestImplementation("org.testcontainers:testcontainers-junit-jupiter")

	testImplementation(project(":core:spring-boot-test"))
	testImplementation(project(":test-support:spring-boot-test-support"))
	testImplementation(testFixtures(project(":core:spring-boot-autoconfigure")))
	testImplementation("com.squareup.okhttp3:mockwebserver")
	testImplementation("org.springframework:spring-web")

	testRuntimeOnly("ch.qos.logback:logback-classic")
}

tasks.named("compileTestJava") {
	options.nullability.checking = "tests"
}

tasks.named("compileDockerTestJava") {
	options.nullability.checking = "tests"
}
