plugins {
	id "java-library"
	id "org.springframework.boot.auto-configuration"
	id "org.springframework.boot.configuration-properties"
	id "org.springframework.boot.deployed"
	id "org.springframework.boot.optional-dependencies"
	id "org.springframework.boot.test-auto-configuration"
}

description = "Spring Boot Jackson 2 (deprecated in favor of spring-boot-jackson)"

dependencies {
	api(project(":core:spring-boot"))
	api("org.springframework:spring-web")
	api("com.fasterxml.jackson.core:jackson-databind")
	api("com.fasterxml.jackson.datatype:jackson-datatype-jdk8")
	api("com.fasterxml.jackson.datatype:jackson-datatype-jsr310")
	api("com.fasterxml.jackson.module:jackson-module-parameter-names")

	optional(project(":core:spring-boot-autoconfigure"))
	optional(project(":core:spring-boot-test-autoconfigure"))
	optional(project(":module:spring-boot-jackson")) {
		exclude(group: "tools.jackson.core", module: "jackson-databind")
	}
	optional("com.fasterxml.jackson.dataformat:jackson-dataformat-cbor")
	optional("com.fasterxml.jackson.dataformat:jackson-dataformat-xml")

	testImplementation(project(":core:spring-boot-test"))
	testImplementation(project(":test-support:spring-boot-test-support"))
	testRuntimeOnly("ch.qos.logback:logback-classic")
}

tasks.named("compileTestJava") {
	options.nullability.checking = "tests"
}
